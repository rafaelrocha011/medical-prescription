name: CD - Deploy manual em homologacao

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'SHA completo (40 caracteres) de commit da branch escolhida com imagens publicadas no CI'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-medicalprescription-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy homologacao (runner propio)
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, medicalprescription-deploy]
    environment: staging
    env:
      COMPOSE_PROJECT_NAME: medicalprescription-staging
      REGISTRY_NAMESPACE: ghcr.io/${{ github.repository }}
      IMAGE_TAG: sha-${{ inputs.commit_sha }}
      DEPLOY_COMMIT: ${{ inputs.commit_sha }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.STAGING_MYSQL_ROOT_PASSWORD }}
      MYSQL_PASSWORD: ${{ secrets.STAGING_MYSQL_PASSWORD }}
      MYSQL_USER: ${{ vars.STAGING_MYSQL_USER }}
      MYSQL_DATABASE: ${{ vars.STAGING_MYSQL_DATABASE }}
      MYSQL_PORT: ${{ vars.STAGING_MYSQL_PORT || '3307' }}
      API_PORT: ${{ vars.STAGING_API_PORT || '5080' }}
      FRONTEND_PORT: ${{ vars.STAGING_FRONTEND_PORT || '4200' }}
    steps:
      - name: Checkout da branch selecionada
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar SHA, origem e credenciais
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo 'SHA invalido'; exit 1; }
          git merge-base --is-ancestor "$DEPLOY_COMMIT" "origin/${GITHUB_REF_NAME}" || { echo "Commit fora de ${GITHUB_REF_NAME}"; exit 1; }
          for value in MYSQL_ROOT_PASSWORD MYSQL_PASSWORD MYSQL_USER MYSQL_DATABASE; do
            if [ -z "${!value}" ]; then
              echo "Configuracao ausente: $value"; exit 1
            fi
          done
          docker compose version
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Conferir manifestos Compose
        shell: bash
        run: docker compose -f docker-compose.yml -f docker-compose.deploy.yml config --quiet
      - name: Baixar imagens testadas
        shell: bash
        run: docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull api frontend migrate
      - name: Iniciar servicos e executar migrations
        shell: bash
        run: docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --no-build
      - name: Verificar API e frontend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused "http://127.0.0.1:${API_PORT}/api/prescricoes?pagina=1&tamanhoPagina=1" >/dev/null
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused "http://127.0.0.1:${FRONTEND_PORT}/prescricoes" >/dev/null
      - name: Resumo dos servicos
        if: always()
        shell: bash
        run: docker compose -f docker-compose.yml -f docker-compose.deploy.yml ps -a
