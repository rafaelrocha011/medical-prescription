name: CI - MedicalPrescription

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build e testes .NET 9
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restaurar dependencias
        run: dotnet restore backend/MedicalPrescription/MedicalPrescription.slnx
      - name: Compilar em Release
        run: dotnet build backend/MedicalPrescription/MedicalPrescription.slnx --configuration Release --no-restore
      - name: Testes unitarios
        run: dotnet test backend/MedicalPrescription/MedicalPrescription.UnitTests/MedicalPrescription.UnitTests.csproj --configuration Release --no-build --no-restore --logger 'trx;LogFileName=unit.trx' --results-directory ./test-results/unit
      - name: Testes de integracao (Testcontainers MySQL)
        run: dotnet test backend/MedicalPrescription/MedicalPrescription.IntegrationTests/MedicalPrescription.IntegrationTests.csproj --configuration Release --no-build --no-restore --logger 'trx;LogFileName=integration.trx' --results-directory ./test-results/integration
      - name: Publicar API
        run: dotnet publish backend/MedicalPrescription/MedicalPrescription.Api/MedicalPrescription.Api.csproj --configuration Release --no-build --no-restore --output ./artifacts/api /p:UseAppHost=false
      - name: Artefato API
        uses: actions/upload-artifact@v4
        with:
          name: api-net9
          path: artifacts/api/
          if-no-files-found: error
          retention-days: 14
      - name: Relatorios de testes .NET
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes-net
          path: test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Build e testes Angular 21
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias reprodutiveis
        run: npm ci --no-audit --no-fund
      - name: Build de producao
        run: npm run build
      - name: Testes Vitest
        run: npm test -- --watch=false
      - name: Artefato frontend
        uses: actions/upload-artifact@v4
        with:
          name: angular21-dist
          path: frontend/dist/medical-prescription-web/browser/
          if-no-files-found: error
          retention-days: 14

  seed-smoke:
    name: Primeiro boot - seed em MySQL vazio
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verificar Docker Compose e catalogos em ambiente limpo
        shell: pwsh
        run: ./scripts/validar-primeira-instalacao.ps1

  images:
    name: Imagens Docker -> GitHub Packages
    needs: [backend, frontend, seed-smoke]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: .
            dockerfile: backend/MedicalPrescription/Dockerfile
            target: final
          - component: migrate
            context: .
            dockerfile: backend/MedicalPrescription/Dockerfile
            target: migrations
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: final
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.component }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
